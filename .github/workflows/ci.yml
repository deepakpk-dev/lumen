name: CI

# Lint, typecheck, and the unit suite — including the zero-knowledge wire
# check (src/data/sync-privacy.test.ts), which is the enforcement half of the
# sync design's "no plaintext health field in any request body" guarantee.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
